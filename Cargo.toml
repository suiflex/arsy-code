[workspace]
members = [
    "crates/arsy-kernel",
    "crates/arsy-compat",
    "crates/arsy-pty",
    "crates/arsy-code",
    "crates/arsy-tui",
    "crates/arsy-cli",
    "crates/arsy-ide",
    "crates/arsy-sandbox",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
# Never published to crates.io (docs/34-distribution.md): binaries ship through
# GitHub Releases and the wrappers. This also lets cargo-deny's
# allow-wildcard-paths apply to the intra-workspace path dependencies.
publish = false
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/suiflex/arsy-code"

[workspace.dependencies]
cap-std = "=4.0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
schemars = { version = "=1.2.2", features = ["uuid1"] }
sha2 = "=0.11.0"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
zstd = { version = "=0.13.3", default-features = false }
globset = "=0.4.19"
proptest = "1"
tempfile = "3"
rpassword = "7.4"
unicode-width = "=0.2.2"
tree-sitter = "=0.25.10"
tree-sitter-rust = "=0.24.2"
toml = "0.9"
yaml_serde = "=0.10.7"
wasmtime = { version = "=48.0.1", default-features = false, features = ["cranelift", "pooling-allocator", "runtime", "std", "wat"] }
rlimit = "=0.11.0"
landlock = "=0.4.7"
seccompiler = "=0.5.0"
libc = "=0.2.189"
windows-sys = "=0.61.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
