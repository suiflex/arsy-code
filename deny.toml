[advisories]
yanked = "deny"
ignore = [
    # bincode 1.3.3, through syntect, which needs it to load its bundled
    # grammars: every syntect feature that parses pulls it in. The advisory
    # is that the crate is unmaintained, not a vulnerability, and its team
    # calls 1.3.3 complete. Scoped to this ID so any other unmaintained crate
    # still fails the check; drop it when syntect moves off bincode.
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained, not vulnerable; syntect needs it to load grammars" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    # rustls and its dependencies: permissive, and equivalent in effect to MIT.
    "ISC",
    # webpki-roots ships the Mozilla CA set as data, not code.
    "CDLA-Permissive-2.0",
    # arrayref, via the resvg/usvg/tiny-skia chain that renders the logo.
    "BSD-2-Clause",
    # foldhash, via hashbrown.
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace crates are depended on by path and never published, so they
# carry no version requirement. Wildcards from crates.io stay denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
