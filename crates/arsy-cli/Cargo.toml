[package]
name = "arsy-cli"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "arsy"
path = "src/main.rs"

[features]
# The supported build. A plugin an operator installed must be callable
# without rebuilding the harness, so the WASM host ships by default rather
# than behind a flag only a developer knows to pass.
default = ["tui", "wasm"]
# `dep:rustix` is Unix-only and declared below: the TUI asks the terminal for
# its size there rather than spawning `stty`, and the non-Unix build keeps the
# subprocess path, so the dependency is not built for it at all.
tui = ["dep:resvg", "dep:rustix"]
dap = ["arsy-code/dap"]
wasm = ["arsy-code/wasm"]
remote-transports = ["arsy-code/remote-transports"]

[dependencies]
arsy-code = { path = "../arsy-code" }
arsy-compat = { path = "../arsy-compat" }
arsy-kernel = { path = "../arsy-kernel", features = ["http"] }
arsy-tui = { path = "../arsy-tui" }
sha2.workspace = true
resvg = { version = "=0.48.1", default-features = false, optional = true }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
unicode-width.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
# Reading a terminal's size, which the `stty` subprocess path cannot do
# cheaply. Safe on its own: `tcgetwinsize` is a plain ioctl wrapper, so the
# workspace's `unsafe_code = "forbid"` stays intact.
rustix = { workspace = true, features = ["termios"], optional = true }


[dev-dependencies]
# The reference thin client, so the pair can be tested as a pair. The
# dependency runs this way round because the client depends on nothing.
arsy-ide = { path = "../arsy-ide" }
tempfile.workspace = true

[lints]
workspace = true
