name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "11 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # An npm version is immutable and is only built at a release tag, so a
  # launcher that cannot be packed, or that disagrees with the release it
  # downloads, has so far been found only after tagging. This checks both on
  # every pull request, in seconds and without a Rust toolchain.
  npm-package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # postinstall derives the archive URL from the manifest version, so the
      # launcher has to carry the version the release is tagged with.
      - name: Launcher version matches the release version
        run: |
          set -euo pipefail
          npm_version="$(node -p "require('./npm/package.json').version")"
          manifest_version="$(node -p "require('./.release-please-manifest.json')['.']")"
          cargo_version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          echo "npm=$npm_version manifest=$manifest_version cargo=$cargo_version"
          test "$npm_version" = "$manifest_version"
          test "$npm_version" = "$cargo_version"
      - name: Launcher packs with every file it names
        working-directory: npm
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            const named = [...(pkg.files || []), ...Object.values(pkg.bin || {})];
            const missing = named.filter((path) => path !== "LICENSE" && !fs.existsSync(path));
            if (missing.length) { console.error("missing from npm/: " + missing.join(", ")); process.exit(1); }
          '
          cp ../LICENSE LICENSE
          npm pack --dry-run

  test:
    name: Linux required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Linux credential-store dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - id: rust
        uses: ./.github/actions/setup-workspace-rust
        with:
          components: rustfmt,clippy
      - name: Formatting
        run: cargo +${{ steps.rust.outputs.version }} fmt --all -- --check
      - name: Clippy
        run: cargo +${{ steps.rust.outputs.version }} clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        # --no-fail-fast: without it cargo stops at the first target that
        # fails, so a platform with several unrelated failures reveals one
        # per run.
        run: cargo +${{ steps.rust.outputs.version }} test --workspace --all-features --locked --no-fail-fast
      - name: Compatibility fixtures
        run: python3 fixtures/compat/check.py

  dependencies:
    name: Advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: rust
        uses: ./.github/actions/setup-workspace-rust
      - run: cargo +${{ steps.rust.outputs.version }} install cargo-deny --version 0.20.2 --locked
      - run: cargo +${{ steps.rust.outputs.version }} deny check

  cross-platform:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: ${{ matrix.os }} scheduled
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: rust
        uses: ./.github/actions/setup-workspace-rust
      - run: cargo +${{ steps.rust.outputs.version }} test --workspace --all-features --locked --no-fail-fast
