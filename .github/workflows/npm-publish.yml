name: npm-publish

on:
  workflow_run:
    workflows: ["Release build"]
    types: [completed]
  workflow_call:
    inputs:
      tag:
        description: Git tag that was released (e.g. v0.1.1)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm (e.g. v0.1.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    # The npm Trusted Publisher for @suiflex/arsy-code is registered against this
    # environment. The OIDC token only carries an `environment` claim when the job
    # runs in one, and npm rejects the publish if the claim does not match.
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # An npm version is immutable, so everything that makes the published
      # launcher resolvable is checked before publishing rather than after.
      # postinstall derives the archive URL from the manifest version and the
      # tag, so the tag has to match the manifest and the release has to carry
      # every archive and sidecar postinstall will ask for -- otherwise a
      # permanent npm version installs from bytes that are not there.
      - name: Verify the release backs this launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.event.workflow_run.head_branch }}"
          test "$tag" = "v$(node -p "require('./npm/package.json').version")"

          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')"
          missing=0
          for archive in \
            arsy-linux-x86_64.tar.gz arsy-linux-aarch64.tar.gz \
            arsy-macos-x86_64.tar.gz arsy-macos-aarch64.tar.gz \
            arsy-windows-x86_64.zip arsy-windows-aarch64.zip
          do
            for asset in "$archive" "$archive.sha256"; do
              printf '%s\n' "$assets" | grep -qxF "$asset" || {
                echo "release $tag is missing $asset" >&2
                missing=1
              }
            done
          done
          test "$missing" = "0"
      # Trusted Publishing (OIDC): no NPM_TOKEN needed. Requires npm >= 11.5.1
      # and this exact workflow path registered as a Trusted Publisher on
      # npmjs.com for @suiflex/arsy-code.
      - run: npm install -g npm@latest
      # `files` is an allowlist rooted at the package directory, so the licence
      # has to sit inside npm/ to ship. Copying it here rather than committing
      # a second copy keeps one source of truth.
      - run: cp LICENSE npm/LICENSE
      - run: npm publish --access public
        working-directory: npm
      # npm acknowledges a publish before it serves the version: v0.5.0 took
      # about three minutes to resolve, while smoke started fourteen seconds
      # after this job and failed every npm channel with ETARGET. Smoke only
      # proves anything once the registry will install what was published.
      - name: Wait until npm serves this version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./npm/package.json').version")"
          for _ in $(seq 1 40); do
            if [ "$(npm view "@suiflex/arsy-code@$version" version --prefer-online 2>/dev/null)" = "$version" ]; then
              echo "npm serves @suiflex/arsy-code@$version"
              exit 0
            fi
            sleep 15
          done
          echo "npm still does not serve @suiflex/arsy-code@$version after 10 minutes" >&2
          exit 1

  # The tag is known here and nowhere downstream: a `workflow_run` trigger on
  # this workflow would see `main`, because this workflow itself runs on main.
  smoke:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ inputs.tag || github.event.workflow_run.head_branch }}
