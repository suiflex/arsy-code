name: Release build

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_call:
    inputs:
      tag:
        description: Git tag to build (e.g. v0.1.1)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build (e.g. v0.1.1)
        required: true
        type: string

permissions:
  contents: read

# FluxGuard and probelm ride in the same archive as `arsy`, so an install has
# resource awareness and model insight without a second install step. The tags
# are pinned rather than tracking `latest`: a release has to build the same way
# tomorrow as it did today, and a bundled dependency that moves on its own is
# not a release.
env:
  FLUXGUARD_TAG: v0.2.0
  PROBELM_TAG: v1.1.0

jobs:
  verify-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - run: sh -n install.sh
      - run: sh tests/install_test.sh
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  build:
    needs: verify-installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: arsy-linux-x86_64.tar.gz
            platform: linux-x86_64
            exe: ""
            archive: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: arsy-linux-aarch64.tar.gz
            platform: linux-aarch64
            exe: ""
            archive: tar
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: arsy-macos-x86_64.tar.gz
            platform: macos-x86_64
            exe: ""
            archive: tar
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: arsy-macos-aarch64.tar.gz
            platform: macos-aarch64
            exe: ""
            archive: tar
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: arsy-windows-x86_64.zip
            platform: windows-x86_64
            exe: .exe
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: arsy-windows-aarch64.zip
            platform: windows-aarch64
            exe: .exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # --all-features reaches the Linux credential store, whose -sys crate
      # needs the system library at build time. CI installs the same packages;
      # the release build has to as well, or it ships from a narrower
      # environment than the one the code was tested in.
      - name: Install Linux credential-store dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - id: rust
        uses: ./.github/actions/setup-workspace-rust
      - run: cargo +${{ steps.rust.outputs.version }} build --workspace --all-features --locked --release
      # Downloaded rather than built here: FluxGuard and probelm release the
      # same six targets under the same platform names, already checksummed,
      # and rebuilding them from source would ship a binary nobody else can
      # verify against. A bundled binary is one more thing an install trusts,
      # so the checksum is checked before the archive is ever unpacked.
      - name: Fetch the bundled FluxGuard binary
        if: matrix.archive == 'tar'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: fluxguard-${{ matrix.platform }}.tar.gz
        run: |
          set -euo pipefail
          mkdir -p dist/fluxguard
          gh release download "$FLUXGUARD_TAG" --repo suiflex/FluxGuard \
            --pattern "$ASSET" --pattern SHA256SUMS --dir dist/fluxguard
          expected="$(awk -v name="$ASSET" '$2 == name || $2 == "*" name {print $1}' dist/fluxguard/SHA256SUMS)"
          test -n "$expected"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "dist/fluxguard/$ASSET" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "dist/fluxguard/$ASSET" | awk '{print $1}')"
          fi
          test "$expected" = "$actual"
          tar -xzf "dist/fluxguard/$ASSET" -C dist/fluxguard
          test -f dist/fluxguard/fluxguard
      - name: Fetch the bundled FluxGuard binary
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: fluxguard-${{ matrix.platform }}.zip
        run: |
          New-Item -ItemType Directory -Force -Path dist/fluxguard | Out-Null
          gh release download $env:FLUXGUARD_TAG --repo suiflex/FluxGuard `
            --pattern $env:ASSET --pattern SHA256SUMS --dir dist/fluxguard
          $line = Select-String -Path dist/fluxguard/SHA256SUMS `
            -Pattern "\s\*?$([regex]::Escape($env:ASSET))$"
          if ($null -eq $line) { throw "no checksum for $env:ASSET" }
          $expected = (($line | Select-Object -First 1).Line.Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 "dist/fluxguard/$env:ASSET").Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "checksum mismatch for $env:ASSET" }
          Expand-Archive -Path "dist/fluxguard/$env:ASSET" -DestinationPath dist/fluxguard -Force
          if (-not (Test-Path dist/fluxguard/fluxguard.exe)) { throw "fluxguard.exe missing" }
      - name: Fetch the bundled probelm binary
        if: matrix.archive == 'tar'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: probelm-${{ matrix.platform }}.tar.gz
        run: |
          set -euo pipefail
          mkdir -p dist/probelm
          gh release download "$PROBELM_TAG" --repo keton-id/probelm \
            --pattern "$ASSET" --pattern SHA256SUMS --dir dist/probelm
          expected="$(awk -v name="$ASSET" '$2 == name || $2 == "*" name {print $1}' dist/probelm/SHA256SUMS)"
          test -n "$expected"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "dist/probelm/$ASSET" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "dist/probelm/$ASSET" | awk '{print $1}')"
          fi
          test "$expected" = "$actual"
          tar -xzf "dist/probelm/$ASSET" -C dist/probelm
          test -f dist/probelm/probelm
      - name: Fetch the bundled probelm binary
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: probelm-${{ matrix.platform }}.zip
        run: |
          New-Item -ItemType Directory -Force -Path dist/probelm | Out-Null
          gh release download $env:PROBELM_TAG --repo keton-id/probelm `
            --pattern $env:ASSET --pattern SHA256SUMS --dir dist/probelm
          $line = Select-String -Path dist/probelm/SHA256SUMS `
            -Pattern "\s\*?$([regex]::Escape($env:ASSET))$"
          if ($null -eq $line) { throw "no checksum for $env:ASSET" }
          $expected = (($line | Select-Object -First 1).Line.Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 "dist/probelm/$env:ASSET").Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "checksum mismatch for $env:ASSET" }
          Expand-Archive -Path "dist/probelm/$env:ASSET" -DestinationPath dist/probelm -Force
          if (-not (Test-Path dist/probelm/probelm.exe)) { throw "probelm.exe missing" }
      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/release/arsy${{ matrix.exe }}" dist/package/arsy
          cp dist/fluxguard/fluxguard dist/package/fluxguard
          cp dist/probelm/probelm dist/package/probelm
          chmod 0755 dist/package/arsy dist/package/fluxguard dist/package/probelm
          tar -C dist/package -czf "dist/${{ matrix.asset }}" arsy fluxguard probelm
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/${{ matrix.asset }}" | awk '{print $1}' > "dist/${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "dist/${{ matrix.asset }}" | awk '{print $1}' > "dist/${{ matrix.asset }}.sha256"
          fi
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item "target/release/arsy${{ matrix.exe }}" dist/package/arsy.exe
          Copy-Item dist/fluxguard/fluxguard.exe dist/package/fluxguard.exe
          Copy-Item dist/probelm/probelm.exe dist/package/probelm.exe
          Compress-Archive -Path "dist/package/*" -DestinationPath "dist/${{ matrix.asset }}"
          (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.asset }}").Hash.ToLowerInvariant() |
            Set-Content -NoNewline "dist/${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error

  # The SBOM describes the workspace, not a target, so it is generated once here
  # rather than six times in the build matrix, where `merge-multiple: true` would
  # collapse six identical trees onto each other. cargo-cyclonedx writes one file
  # per crate under crates/<crate>/; they are flattened into dist/ because
  # action-gh-release's `files: dist/*` glob is single-level.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - id: rust
        uses: ./.github/actions/setup-workspace-rust
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo +${{ steps.rust.outputs.version }} install cargo-cyclonedx --version 0.5.9 --locked
          cargo +${{ steps.rust.outputs.version }} cyclonedx --all --format json
          mkdir -p dist
          find . -name '*.cdx.json' -not -path './dist/*' -print0 |
            xargs -0 -I{} sh -c 'cp "{}" "dist/$(basename "{}")"'
          ls dist/*.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: dist/*.cdx.json
          if-no-files-found: error

  # The per-archive .sha256 sidecars stay: install.sh and install.ps1 read them
  # directly. This adds the aggregate SHA256SUMS that docs/34-distribution.md
  # documents, signed with keyless Sigstore so the canonical channel can be
  # verified rather than merely checksummed.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Build the aggregate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # The sidecars hold a bare digest; sha256sum --check wants
          # "<digest>  <file>". Archives only: the sums file describes the
          # installable artifacts, not itself or the SBOM.
          for archive in arsy-*.tar.gz arsy-*.zip; do
            test -f "$archive"
            printf '%s  %s\n' "$(tr -d '[:space:]' < "${archive}.sha256")" "$archive"
          done > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # The bundle carries the signature, the certificate, and the
          # transparency-log entry. cosign v3 ignores --output-signature when
          # it writes one, so asking for a separate .sig produced nothing and
          # left the documented verification pointing at a missing file.
          cosign sign-blob --yes --bundle SHA256SUMS.bundle SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checksums
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.bundle
          if-no-files-found: error

  publish:
    needs: [build, sbom, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      # install.sh / install.ps1 ship as release assets because README and
      # docs/34 point curl and irm at releases/latest/download/.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Arsy-code ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
            install.sh
            install.ps1

  # Distribution channels: siblings of each other, both gated on `publish`. Neither needs
  # the other, so a tap failure does not cancel the bucket push or vice versa.
  #
  # Checksums come from this run's artifacts rather than from `gh release download`: they
  # are already built and hashed here, so there is nothing to re-fetch and no race against
  # release-asset propagation. They are read from `SHA256SUMS` rather than the per-archive
  # sidecars, because `SHA256SUMS` is the file cosign signs -- a formula or manifest
  # pinning a digest from anywhere else could not be said to consume the canonical one.
  # A missing line means a missing archive, and `sha()` fails there rather than rendering
  # an empty digest.

  publish-homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Render the formula and push it to the tap
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # `var=$(sha ...)` is a simple assignment, so a missing line aborts the
          # step under `set -e`; inside a `sed` argument it would only have
          # rendered an empty digest.
          sha() {
            awk -v name="arsy-$1" '$2 == name { found = 1; print $1 } END { exit !found }' \
              dist/SHA256SUMS
          }
          mac_arm="$(sha macos-aarch64.tar.gz)"
          mac_x64="$(sha macos-x86_64.tar.gz)"
          linux_arm="$(sha linux-aarch64.tar.gz)"
          linux_x64="$(sha linux-x86_64.tar.gz)"

          sed -e "s|@VERSION@|${version}|g" \
              -e "s|@BASE@|${base}|g" \
              -e "s|@MAC_ARM_SHA@|${mac_arm}|g" \
              -e "s|@MAC_X64_SHA@|${mac_x64}|g" \
              -e "s|@LINUX_ARM_SHA@|${linux_arm}|g" \
              -e "s|@LINUX_X64_SHA@|${linux_x64}|g" \
              packaging/arsy-code.rb.tmpl > arsy-code.rb
          # A surviving placeholder means an artifact was missing. Fail here rather than
          # publishing a formula that cannot install. `! grep ...` would not: errexit
          # does not apply to a command whose status is inverted.
          if grep -q '@[A-Z_]*@' arsy-code.rb; then
            echo "unrendered placeholder in arsy-code.rb" >&2
            exit 1
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/suiflex/homebrew-tap.git" tap
          mkdir -p tap/Formula
          mv arsy-code.rb tap/Formula/arsy-code.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/arsy-code.rb
          git commit -m "arsy-code ${version}" || { echo "tap already up to date"; exit 0; }
          git push

  publish-scoop:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Render the manifest and push it to the bucket
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # `var=$(sha ...)` is a simple assignment, so a missing line aborts the
          # step under `set -e`; inside a `sed` argument it would only have
          # rendered an empty digest.
          sha() {
            awk -v name="arsy-$1" '$2 == name { found = 1; print $1 } END { exit !found }' \
              dist/SHA256SUMS
          }
          win_x64="$(sha windows-x86_64.zip)"
          win_arm64="$(sha windows-aarch64.zip)"

          sed -e "s|@VERSION@|${version}|g" \
              -e "s|@BASE@|${base}|g" \
              -e "s|@WIN_X64_SHA@|${win_x64}|g" \
              -e "s|@WIN_ARM64_SHA@|${win_arm64}|g" \
              packaging/arsy-code.json.tmpl > arsy-code.json
          if grep -q '@[A-Z_]*@' arsy-code.json; then
            echo "unrendered placeholder in arsy-code.json" >&2
            exit 1
          fi
          jq empty arsy-code.json

          git clone "https://x-access-token:${GH_TOKEN}@github.com/suiflex/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          mv arsy-code.json bucket/bucket/arsy-code.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/arsy-code.json
          git commit -m "arsy-code ${version}" || { echo "bucket already up to date"; exit 0; }
          git push

  verify-release:
    needs: [publish, publish-homebrew, publish-scoop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download final published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir release
          gh release download "$TAG" --dir release \
            --pattern 'arsy-*.tar.gz' --pattern 'arsy-*.zip' \
            --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.bundle' \
            --pattern 'install.sh' --pattern 'install.ps1'
      - name: Independently verify digest and workflow identity
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.bundle \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
      - name: Smoke-test Linux archive and record durable report
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir smoke
          tar -xzf release/arsy-linux-x86_64.tar.gz -C smoke
          test -x smoke/arsy
          test -x smoke/fluxguard
          test -x smoke/probelm
          version="$(smoke/arsy --version)"
          digest="$(sha256sum release/arsy-linux-x86_64.tar.gz | awk '{print $1}')"
          jq -n --arg channel github-release --arg tag "$TAG" \
            --arg target linux-x86_64 --arg digest "$digest" --arg version "$version" \
            '{schema:1,channel:$channel,tag:$tag,target:$target,digest:$digest,signature:true,installer_assets:true,launch:$version}' \
            > release-smoke-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-smoke-report
          path: release-smoke-report.json
          if-no-files-found: error
